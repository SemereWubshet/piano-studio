<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 
        Piano Studio - Main Application Shell
        
        A lightweight web application for piano practice.
        Displays sheet music from ABC notation with MIDI playback and live editing.
        Powered by ABCJS for notation rendering and synthesis.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Studio</title>
    
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic-min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/abcjs-audio.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>🎹 Piano Studio</h2>
            </div>
            <div class="sidebar-section">
                <span>SCORE FILES</span>
            </div>
            
            <ul id="file-list" class="file-list">
                <li class="placeholder">Loading scores...</li>
            </ul>
        </aside>

        <main id="main-stage">
            
            <header id="top-bar">
                <div class="score-meta" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <button id="btn-toggle-sidebar" class="btn-sidebar-toggle" title="Toggle Sidebar">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
                            <line x1="9" y1="3" x2="9" y2="21"></line>
                        </svg>
                    </button>

                    <h1 id="active-score-title">Select a Score File</h1>
                    <div class="top-bar-right" style="display: flex; align-items: center; gap: 10px;">
                        <div class="voice-picker-container" title="Select Piano Voice & Instrument Timbre">
                            <select id="select-piano-voice" class="select-piano-voice" aria-label="Select Piano Voice">
                                <option value="concert_grand">🎹 Concert Grand</option>
                                <option value="upright_warm">🏛️ Warm Upright Piano</option>
                                <option value="ep_rhodes">⚡ Rhodes Velvet EP</option>
                                <option value="cp80_sample">🎸 Electric Grand CP80</option>
                                <option value="synth_keyboard">🎛️ Synth Keyboard</option>
                            </select>
                        </div>
                        <button id="btn-toggle-sustain" class="btn btn-sm btn-sustain" title="Toggle Virtual Sustain Pedal (Hold notes after key release)">
                            <span class="sustain-pedal-icon">🦶</span> <span>Sustain: OFF</span>
                        </button>
                        <div id="midi-status-pill" class="midi-status-pill" title="USB MIDI Status (Plug in keyboard to mirror notes and practice in Wait Mode)">
                            <span id="midi-status-dot" class="midi-dot waiting"></span>
                            <span id="midi-device-status">No USB MIDI</span>
                            <button id="btn-midi-sound" class="midi-sound-btn" title="Toggle Web Synth Sound for USB MIDI Input">🔊</button>
                        </div>
                        <button id="btn-quit" class="btn btn-sm btn-ghost" title="Shutdown Server & Close">
                            <i class="fa-solid fa-power-off"></i> <span>Quit Studio</span>
                        </button>
                    </div>
                </div>
            </header>

            <section id="audio-bar">
                <div id="midi-audio-controls">
                    <span class="placeholder-text">Audio controls will appear here...</span>
                </div>
                <div id="lead-in-container" class="lead-in-control" title="Lead-in timer before playback starts (in seconds)">
                    <span class="lead-in-label">⏳ Lead-in:</span>
                    <input type="number" id="lead-in-input" min="0" max="30" step="1" value="3" aria-label="Lead-in seconds">
                    <span class="lead-in-unit">s</span>
                    <span id="lead-in-badge" class="lead-in-badge hidden" title="Counting down... Click to cancel">3</span>
                </div>
                <div class="view-controls">
                    <button id="btn-zoom-out" class="btn" title="Zoom Out">-</button>
                    <button id="btn-zoom-in" class="btn" title="Zoom In">+</button>
                    <button id="btn-wait-mode" class="btn" title="Interactive Wait-For-Me Practice Mode (W) - Score advances as you play the correct notes">
                        <span>🎯</span> <span id="wait-mode-label">Wait (W)</span>
                    </button>
                    <button id="btn-toggle-editor" class="btn">Toggle Editor</button>
                    <button id="btn-toggle-keyboard" class="btn" title="Toggle Light-Up Piano Keyboard (K)">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;">
                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                            <path d="M6 4v9m4-9v9m4-9v9m4-9v9"/>
                        </svg>
                        <span>Piano (K)</span>
                    </button>
                    <button id="btn-toggle-focus" class="btn" title="Focus Mode (Maximize Sheet) (F)">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                        </svg>
                        <span>Focus</span>
                    </button>
                </div>
            </section>

            <div id="workspace-body">
                
                <div id="sheet-wrapper">
                    <div id="paper-stage">
                        <div id="paper"></div>
                    </div> 
                </div>

                <div id="editor-drawer" class="editor-drawer hidden">
                    <div class="drawer-header">
                        <span>ABC File Editor</span>
                        <div class="drawer-actions">
                            <button id="btn-record-midi" class="btn btn-record" title="Record live USB MIDI notes & chords straight into ABC notation">🔴 Record MIDI</button>
                            <button id="btn-save" class="btn btn-primary" title="Save Changes (Ctrl + Enter)">Save Changes</button>
                        </div>
                    </div>
                    <textarea id="abc-source" spellcheck="false" placeholder="Raw ABC code will load here..."></textarea>
                </div>

            </div>

            <!-- Bottom Interactive Piano Dock -->
            <footer id="piano-dock">
                <div class="piano-resize-handle" id="piano-resize-handle" title="Drag to resize piano height"></div>
                <div class="piano-scroll-container">
                    <div id="piano-keyboard" class="piano-keyboard"></div>
                </div>
            </footer>
        </main>
    </div>

    <!-- Floating Focus Controls -->
    <div id="focus-controls">
        <button id="btn-focus-zoom-out" class="focus-btn" title="Zoom Out (-)">-</button>
        <span id="focus-zoom-level">100%</span>
        <button id="btn-focus-zoom-in" class="focus-btn" title="Zoom In (+)">+</button>
        <button id="btn-exit-focus" class="focus-btn focus-exit" title="Exit Focus Mode (Esc or F)">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 14h6m0 0v6m0-6L3 21m17-7h-6m0 0v6m0-6l7 7M10 10H4m6 0V4m0 6L3 3m17 7h-6m0 0V4m0 6l7-7"/>
            </svg>
            <span>Exit Focus</span>
        </button>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
