<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 
        Piano Studio - Main Application Shell
        
        A lightweight web application for piano practice.
        Displays sheet music from ABC notation with MIDI playback and live editing.
        Powered by ABCJS for notation rendering and synthesis.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Studio</title>
    
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic-min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/abcjs-audio.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>🎹 Piano Studio</h2>
            </div>
            <div class="sidebar-section">
                <span>SCORE FILES</span>
            </div>
            
            <ul id="file-list" class="file-list">
                <li class="placeholder">Loading scores...</li>
            </ul>
        </aside>

        <main id="main-stage">
            
            <header id="top-bar">
                <div class="score-meta" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <button id="btn-toggle-sidebar" class="btn-sidebar-toggle" title="Toggle Sidebar">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
                            <line x1="9" y1="3" x2="9" y2="21"></line>
                        </svg>
                    </button>

                    <h1 id="active-score-title">Select a Score File</h1>
                    <button id="btn-quit" class="btn btn-sm btn-ghost" title="Shutdown Server & Close">
                    <i class="fa-solid fa-power-off"></i> <span>Quit Studio</span>
                    </button>
                </div>
            </header>

            <section id="audio-bar">
                <div id="midi-audio-controls">
                    <span class="placeholder-text">Audio controls will appear here...</span>
                </div>
                <div class="view-controls">
                    <button id="btn-zoom-out" class="btn" title="Zoom Out">-</button>
                    <button id="btn-zoom-in" class="btn" title="Zoom In">+</button>
                    <button id="btn-toggle-editor" class="btn">Toggle Editor</button>
                </div>
            </section>

            <div id="workspace-body">
                
                <div id="sheet-wrapper">
                    <div id="paper"></div> 
                </div>

                <div id="editor-drawer" class="editor-drawer hidden">
                    <div class="drawer-header">
                        <span>ABC File Editor</span>
                        <button id="btn-save" class="btn btn-primary">Save Changes</button>
                    </div>
                    <textarea id="abc-source" spellcheck="false" placeholder="Raw ABC code will load here..."></textarea>
                </div>

            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
